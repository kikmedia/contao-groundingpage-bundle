name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer validate --strict --no-check-lock

  php-lint:
    name: PHP lint (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint all PHP files
        run: find src contao tests -name '*.php' -print0 | xargs -0 -n1 php -l

  composer-install:
    name: Composer install (PHP ${{ matrix.php-version }}, Contao ${{ matrix.contao-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
        contao-version: ['5.3.*', '5.7.*', '6.0.*']
        dependencies: ['highest', 'lowest']
        exclude:
          - php-version: '8.3'
            contao-version: '6.0.*'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Strip require-dev (this job only tests the production require section)
        run: php -r '$c = json_decode(file_get_contents("composer.json"), true); unset($c["require-dev"], $c["autoload-dev"], $c["scripts"]); file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n");'

      - name: Require matching contao/core-bundle constraint
        run: composer require --no-update --no-interaction "contao/core-bundle:${{ matrix.contao-version }}"

      - name: Install dependencies (${{ matrix.dependencies }})
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

  tests:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpunit

  static-analysis:
    name: PHPStan (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpstan analyse --no-progress

  coding-standards:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  acceptance:
    name: Acceptance (PHP ${{ matrix.php-version }}, Contao ${{ matrix.contao-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
        contao-version: ['5.3.*', '5.7.*', '6.0.*']
        exclude:
          - php-version: '8.3'
            contao-version: '6.0.*'
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: contao
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, intl, pdo_mysql
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2

      - name: Run the acceptance suite against a real Contao installation
        run: tests/acceptance/run.sh "${{ matrix.contao-version }}"
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/contao?serverVersion=10.11.0-MariaDB

